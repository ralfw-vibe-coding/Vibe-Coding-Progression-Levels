<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mein Depot</title>
<style>
  :root {
    --ink: #181A2A;
    --ink-muted: #6B6D80;
    --ink-faint: #8B8DA0;
    --border: #E7E7EF;
    --track: #F3F3F8;
    --green: #0F9D58;
    --red: #DC2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 20px;
    background: #F4F4F7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    background: #FFFFFF;
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 1px 3px rgba(24,26,42,0.06);
  }
  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }
  .page-header h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
  }
  .page-header .meta {
    font-size: 13px;
    color: var(--ink-faint);
  }
  .hero {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .hero-card {
    border-radius: 12px;
    padding: 16px;
  }
  .hero-card.wert { background: #EEF0FF; }
  .hero-card.veraend { background: #E7F8EF; }
  .hero-label {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    font-size: 12px;
    font-weight: 500;
  }
  .hero-card.wert .hero-label { color: #4F46E5; }
  .hero-card.veraend .hero-label { color: var(--green); }
  .hero-value {
    font-size: 24px;
    font-weight: 600;
    line-height: 1.15;
  }
  .hero-card.veraend .hero-value { color: var(--green); }
  .hero-sub {
    font-size: 12px;
    font-weight: 500;
    margin-top: 4px;
    opacity: 0.75;
  }
  .hero-card.wert .hero-sub { color: #6266C4; }
  .hero-card.veraend .hero-sub { color: var(--green); }
  .positions {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
  }
  .card {
    border: 0.5px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .card.dimmed { opacity: 0.5; }
  .card-strip { height: 4px; }
  .strip-zert { background: #D97706; }
  .strip-fonds { background: #7C3AED; }
  .strip-etf { background: #2563EB; }
  .strip-aktie { background: #DB2777; }
  .card-body { padding: 12px; }
  .card-top {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 500;
  }
  .badge-zert { background: #FDF1DC; color: #8A5A0A; }
  .badge-fonds { background: #F1E9FD; color: #6226C4; }
  .badge-etf { background: #E5EEFF; color: #1D4FBE; }
  .badge-aktie { background: #FCE7F3; color: #A61E5E; }
  .wkn {
    font-size: 11px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--ink-faint);
    text-decoration: none;
  }
  .wkn:hover { text-decoration: underline; }
  .card-name {
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 8px;
  }
  .card-value-row {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 4px;
  }
  .card-value {
    font-size: 18px;
    font-weight: 600;
  }
  .card-value-detail {
    font-size: 12px;
    font-weight: 400;
    color: var(--ink-faint);
  }
  .card-sub-row {
    font-size: 12px;
    color: var(--ink-faint);
    margin-bottom: 8px;
  }
  .bar-track {
    height: 9px;
    display: flex;
    align-items: center;
    margin-bottom: 8px;
  }
  .bar-track.neg { justify-content: flex-end; }
  .bar {
    background: var(--green);
  }
  .bar.neg { background: var(--red); }
  .card-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .pct { font-size: 12px; font-weight: 500; color: var(--green); }
  .pct.neg { color: var(--red); }
  .pct.zero { color: var(--ink-faint); }
  .share {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--ink-faint);
  }
  .share svg { flex-shrink: 0; }

  .page-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .add-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    padding: 0;
    border: 0.5px solid var(--border);
    border-radius: 999px;
    background: #FFFFFF;
    color: var(--ink-muted);
    cursor: pointer;
  }
  .add-btn:hover { background: var(--track); color: var(--ink); }
  .card-top-right {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card-add-wrap {
    position: relative;
  }
  .card-add-wrap .add-btn { width: 18px; height: 18px; }
  .add-menu {
    display: none;
    position: absolute;
    right: 0;
    top: 24px;
    z-index: 10;
    background: #FFFFFF;
    border: 0.5px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(24,26,42,0.12);
    min-width: 160px;
    overflow: hidden;
  }
  .card-add-wrap.open .add-menu { display: block; }
  .add-menu button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 8px 12px;
    border: none;
    background: none;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
    font-family: inherit;
  }
  .add-menu button:hover { background: var(--track); }

  dialog {
    border: none;
    border-radius: 16px;
    padding: 24px;
    width: 320px;
    max-width: calc(100vw - 40px);
    box-shadow: 0 8px 32px rgba(24,26,42,0.18);
  }
  dialog::backdrop { background: rgba(24,26,42,0.35); }
  dialog h2 {
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 16px;
  }
  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--ink-muted);
    margin-bottom: 4px;
  }
  .field input, .field select {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    border: 0.5px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    color: var(--ink);
  }
  .field-info {
    font-size: 13px;
    color: var(--ink-muted);
    margin-bottom: 12px;
  }
  .dialog-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 20px;
  }
  .btn {
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-secondary {
    border: 0.5px solid var(--border);
    background: #FFFFFF;
    color: var(--ink);
  }
  .btn-secondary:hover { background: var(--track); }
  .btn-primary {
    border: none;
    background: var(--ink);
    color: #FFFFFF;
  }
  .btn-primary:hover { opacity: 0.9; }
</style>
</head>
<body>
<main>

  <div class="page-header">
    <div class="page-header-left">
      <h1>Mein Depot</h1>
      <button type="button" class="add-btn" id="btn-neue-position" aria-label="Neue Position erfassen">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      </button>
    </div>
    <div class="meta">Peter Salz · 26.07.2026</div>
  </div>

  <div class="hero">
    <div class="hero-card wert">
      <div class="hero-label">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
        <span>Depotwert</span>
      </div>
      <div class="hero-value" id="hero-wert"></div>
      <div class="hero-sub" id="hero-kaufwert"></div>
    </div>
    <div class="hero-card veraend">
      <div class="hero-label">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
        <span>Veränderung</span>
      </div>
      <div class="hero-value" id="hero-veraenderung-pct"></div>
      <div class="hero-sub" id="hero-veraenderung-abs"></div>
    </div>
  </div>

  <div class="positions" id="positions"></div>

</main>

<dialog id="dialog-neue-position">
  <form id="form-neue-position">
    <h2>Neue Position erfassen</h2>
    <div class="field"><label for="np-wkn">WKN</label><input id="np-wkn" name="wkn" type="text" required></div>
    <div class="field"><label for="np-name">Name</label><input id="np-name" name="name" type="text" required></div>
    <div class="field">
      <label for="np-typ">Typ</label>
      <select id="np-typ" name="typ">
        <option>Zertifikat</option>
        <option>Fonds</option>
        <option>ETF</option>
        <option>Aktie</option>
      </select>
    </div>
    <div class="field"><label for="np-stueck">Stück</label><input id="np-stueck" name="stueck" type="number" step="any" min="0" required></div>
    <div class="field"><label for="np-kaufkurs">Kaufkurs (€)</label><input id="np-kaufkurs" name="kaufkurs" type="number" step="any" min="0" required></div>
    <div class="field"><label for="np-kurs">Aktueller Kurs (€)</label><input id="np-kurs" name="kurs" type="number" step="any" min="0" required></div>
    <div class="field"><label for="np-datum">Datum</label><input id="np-datum" name="datum" type="date" required></div>
    <div class="dialog-actions">
      <button type="button" class="btn btn-secondary" data-close>Abbrechen</button>
      <button type="submit" class="btn btn-primary">Speichern</button>
    </div>
  </form>
</dialog>

<dialog id="dialog-kauf">
  <form id="form-kauf">
    <h2>Kauf erfassen</h2>
    <div class="field-info" id="kauf-position-info"></div>
    <div class="field"><label for="k-stueck">Stück</label><input id="k-stueck" name="stueck" type="number" step="any" min="0" required></div>
    <div class="field"><label for="k-kaufkurs">Kaufkurs (€)</label><input id="k-kaufkurs" name="kaufkurs" type="number" step="any" min="0" required></div>
    <div class="field"><label for="k-datum">Datum</label><input id="k-datum" name="datum" type="date" required></div>
    <div class="dialog-actions">
      <button type="button" class="btn btn-secondary" data-close>Abbrechen</button>
      <button type="submit" class="btn btn-primary">Speichern</button>
    </div>
  </form>
</dialog>

<dialog id="dialog-kursupdate">
  <form id="form-kursupdate">
    <h2>Kursupdate erfassen</h2>
    <div class="field-info" id="kursupdate-position-info"></div>
    <div class="field"><label for="ku-kurs">Kurs (€)</label><input id="ku-kurs" name="kurs" type="number" step="any" min="0" required></div>
    <div class="field"><label for="ku-datum">Datum</label><input id="ku-datum" name="datum" type="date" required></div>
    <div class="dialog-actions">
      <button type="button" class="btn btn-secondary" data-close>Abbrechen</button>
      <button type="submit" class="btn btn-primary">Speichern</button>
    </div>
  </form>
</dialog>

<script id="event-store">
  // Append-only Event-Store: der Ausgangszustand des Depots, als Ereignisse statt als
  // fertig berechnete Werte. "kauf" legt eine Position mit Erstbestand an, "kursupdate"
  // trägt den zuletzt bekannten Kurs nach. Alle angezeigten Zahlen (Wert, Veränderung,
  // Portfolio-Anteil, Balkenskala) werden daraus berechnet, nicht hier hinterlegt.
  //
  // Jedes Ereignis: { seq, eventType, timestamp, payload }.
  // - timestamp ist rein technisch (wann dieser Event-Store geschrieben wurde) und hat
  //   keine fachliche Bedeutung — hier einheitlich der Autorentag dieser Stufe.
  // - payload.datum ist das fachliche Datum, dessen Bedeutung vom eventType abhängt:
  //   bei "kauf" das Kaufdatum, bei "kursupdate" das Datum des Kurses selbst.
  // - Für "kauf" ist das Kaufdatum in der Quelle nicht überliefert -> angenommen: 1.7.2026.
  //   Für "kursupdate" ist das Datum in den Quelldaten vorhanden und wird übernommen; nur
  //   bei den beiden wertlosen Ameria-Positionen fehlt auch das, ebenfalls 1.7.2026 angenommen.
  const TECHNISCHES_TIMESTAMP = "2026-07-26T00:00:00";
  const ANGENOMMENES_DATUM = "2026-07-01";

  const events = [
    { seq: 1, eventType: "kauf", timestamp: TECHNISCHES_TIMESTAMP, payload: { wkn: "LS9KF5", name: "Lang+Schwarz O.E. Index", typ: "Zertifikat", stueck: 1, kaufkurs: 373.57, datum: ANGENOMMENES_DATUM } },
    { seq: 2, eventType: "kauf", timestamp: TECHNISCHES_TIMESTAMP, payload: { wkn: "EWG2LD", name: "Boerse Stuttg. Euwax-Gold", typ: "Zertifikat", stueck: 100, kaufkurs: 53.57, datum: ANGENOMMENES_DATUM } },
    { seq: 3, eventType: "kauf", timestamp: TECHNISCHES_TIMESTAMP, payload: { wkn: "DWS0R4", name: "Arero-Der Weltfonds Inh.", typ: "Fonds", stueck: 10, kaufkurs: 211.26, datum: ANGENOMMENES_DATUM } },
    { seq: 4, eventType: "kauf", timestamp: TECHNISCHES_TIMESTAMP, payload: { wkn: "LS9GLD", name: "Lang+Schwarz O.E. Index", typ: "Zertifikat", stueck: 1, kaufkurs: 627.29, datum: ANGENOMMENES_DATUM } },
    { seq: 5, eventType: "kauf", timestamp: TECHNISCHES_TIMESTAMP, payload: { wkn: "A2QBZ1", name: "ISVP.-IS.M.EES EOA", typ: "ETF", stueck: 68.476, kaufkurs: 11.1479, datum: ANGENOMMENES_DATUM } },
    { seq: 6, eventType: "kauf", timestamp: TECHNISCHES_TIMESTAMP, payload: { wkn: "LS9CHS", name: "Lang+Schwarz O.E. Index", typ: "Zertifikat", stueck: 1, kaufkurs: 315.97, datum: ANGENOMMENES_DATUM } },
    { seq: 7, eventType: "kauf", timestamp: TECHNISCHES_TIMESTAMP, payload: { wkn: "LS9BGR", name: "Lang+Schwarz O.E. Index", typ: "Zertifikat", stueck: 1, kaufkurs: 327.02, datum: ANGENOMMENES_DATUM } },
    { seq: 8, eventType: "kauf", timestamp: TECHNISCHES_TIMESTAMP, payload: { wkn: "LS9ETB", name: "Lang+Schwarz O.E. Index", typ: "Zertifikat", stueck: 1, kaufkurs: 428.30, datum: ANGENOMMENES_DATUM } },
    { seq: 9, eventType: "kauf", timestamp: TECHNISCHES_TIMESTAMP, payload: { wkn: "722713", name: "Strategy A New DL-001", typ: "Aktie", stueck: 2, kaufkurs: 330.70, datum: ANGENOMMENES_DATUM } },
    { seq: 10, eventType: "kauf", timestamp: TECHNISCHES_TIMESTAMP, payload: { wkn: "A2LQVD", name: "Ameria AG VNA ST ON PR.P.", typ: "Aktie", stueck: 1, kaufkurs: null, datum: ANGENOMMENES_DATUM } },
    { seq: 11, eventType: "kauf", timestamp: TECHNISCHES_TIMESTAMP, payload: { wkn: "A2NBP6", name: "Ameria AG VNA VZO ON PR.P", typ: "Aktie", stueck: 1, kaufkurs: null, datum: ANGENOMMENES_DATUM } },

    { seq: 12, eventType: "kursupdate", timestamp: TECHNISCHES_TIMESTAMP, payload: { wkn: "LS9KF5", kurs: 937.49, datum: "2026-07-24T11:12:25" } },
    { seq: 13, eventType: "kursupdate", timestamp: TECHNISCHES_TIMESTAMP, payload: { wkn: "EWG2LD", kurs: 117.36, datum: "2026-07-24T21:54:29" } },
    { seq: 14, eventType: "kursupdate", timestamp: TECHNISCHES_TIMESTAMP, payload: { wkn: "DWS0R4", kurs: 347.00, datum: "2026-07-24T22:47:48" } },
    { seq: 15, eventType: "kursupdate", timestamp: TECHNISCHES_TIMESTAMP, payload: { wkn: "LS9GLD", kurs: 916.38, datum: "2026-07-24T08:06:11" } },
    { seq: 16, eventType: "kursupdate", timestamp: TECHNISCHES_TIMESTAMP, payload: { wkn: "A2QBZ1", kurs: 15.878, datum: "2026-07-24T17:35:56" } },
    { seq: 17, eventType: "kursupdate", timestamp: TECHNISCHES_TIMESTAMP, payload: { wkn: "LS9CHS", kurs: 356.86, datum: "2026-07-24T08:06:21" } },
    { seq: 18, eventType: "kursupdate", timestamp: TECHNISCHES_TIMESTAMP, payload: { wkn: "LS9BGR", kurs: 331.62, datum: "2026-07-24T13:16:55" } },
    { seq: 19, eventType: "kursupdate", timestamp: TECHNISCHES_TIMESTAMP, payload: { wkn: "LS9ETB", kurs: 415.81, datum: "2026-07-24T08:05:13" } },
    { seq: 20, eventType: "kursupdate", timestamp: TECHNISCHES_TIMESTAMP, payload: { wkn: "722713", kurs: 80.64, datum: "2026-07-24T22:02:45" } },
    { seq: 21, eventType: "kursupdate", timestamp: TECHNISCHES_TIMESTAMP, payload: { wkn: "A2LQVD", kurs: 0, datum: ANGENOMMENES_DATUM } },
    { seq: 22, eventType: "kursupdate", timestamp: TECHNISCHES_TIMESTAMP, payload: { wkn: "A2NBP6", kurs: 0, datum: ANGENOMMENES_DATUM } },
  ];
</script>

<script>
  const TYP_KLASSE = { "Zertifikat": "zert", "Fonds": "fonds", "ETF": "etf", "Aktie": "aktie" };

  function positionenAusEvents(events) {
    // Mehrere "kauf"-Events zur selben WKN sind Nachkäufe und werden addiert:
    // Stück summiert sich, Kaufwert ist die Summe der einzelnen Stück×Kaufkurs-Anteile.
    // Name/Typ kommen vom ersten "kauf"-Event dieser WKN (der Position ihre Identität gibt).
    const kaeufe = new Map();
    const kurse = new Map();
    for (const e of events) {
      if (e.eventType === "kauf") {
        const p = e.payload;
        let agg = kaeufe.get(p.wkn);
        if (!agg) {
          agg = { name: p.name, typ: p.typ, stueck: 0, kaufwertSumme: 0, kaufwertBekannt: false };
          kaeufe.set(p.wkn, agg);
        }
        agg.stueck += p.stueck;
        if (p.kaufkurs != null) {
          agg.kaufwertSumme += p.stueck * p.kaufkurs;
          agg.kaufwertBekannt = true;
        }
      }
      if (e.eventType === "kursupdate") {
        const bisher = kurse.get(e.payload.wkn);
        if (!bisher || e.payload.datum > bisher.datum) kurse.set(e.payload.wkn, e.payload);
      }
    }
    const positionen = [];
    for (const [wkn, agg] of kaeufe) {
      const kursupdate = kurse.get(wkn);
      const kurs = kursupdate ? kursupdate.kurs : null;
      const kursDatum = kursupdate ? kursupdate.datum : null;
      const wert = kurs != null ? agg.stueck * kurs : 0;
      const kaufwert = agg.kaufwertBekannt ? agg.kaufwertSumme : null;
      const kaufkurs = kaufwert != null ? kaufwert / agg.stueck : null; // durchschnittlicher Kaufkurs über alle Käufe
      const diffAbs = kaufwert != null ? wert - kaufwert : null;
      const diffPct = kaufwert ? (diffAbs / kaufwert) * 100 : null;
      positionen.push({ wkn, name: agg.name, typ: agg.typ, stueck: agg.stueck, wert, kurs, kursDatum, kaufwert, kaufkurs, diffAbs, diffPct });
    }
    return positionen;
  }

  function fmtEUR(n) {
    return n.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
  }
  function fmtSignedEUR(n) {
    return (n >= 0 ? "+" : "") + fmtEUR(n);
  }
  function fmtPct(n) {
    return (n >= 0 ? "+" : "") + n.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "%";
  }
  // Kurse (Einzelpreise) behalten ihre Quellgenauigkeit (z. B. 11,1479 € bei Bruchstück-ETFs)
  // statt auf 2 Nachkommastellen gerundet zu werden wie die großen Summen.
  function fmtKurs(n) {
    return n.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 4 }) + " €";
  }
  function fmtStueck(n) {
    return Number.isInteger(n) ? n.toLocaleString("de-DE") : n.toLocaleString("de-DE", { minimumFractionDigits: 3, maximumFractionDigits: 3 });
  }
  function fmtDatum(datum) {
    const [jahr, monat, tag] = datum.split("T")[0].split("-");
    return `${tag}.${monat}.${jahr}`;
  }
  // Logarithmische Balkenskala: 0 % -> 0 %, 100 % Kursgewinn -> ~50 % Länge,
  // 500 % -> ~75 % Länge. Keine harte Obergrenze, nur zunehmend flacher.
  function balkenAnteil(pct) {
    return Math.min(1, (0.5 * Math.log(1 + Math.abs(pct) / 5)) / Math.log(21));
  }
  function balkenDicke(anteil) {
    return Math.min(9, Math.max(3, 3 + 6 * anteil));
  }

  function render() {
    const positionen = positionenAusEvents(events);
    const depotwert = positionen.reduce((s, p) => s + p.wert, 0);
    const kaufwertGesamt = positionen.reduce((s, p) => s + (p.kaufwert ?? 0), 0);
    const veraenderungAbs = depotwert - kaufwertGesamt;
    const veraenderungPct = kaufwertGesamt ? (veraenderungAbs / kaufwertGesamt) * 100 : 0;

    document.getElementById("hero-wert").textContent = fmtEUR(depotwert);
    document.getElementById("hero-kaufwert").textContent = "Kaufwert " + fmtEUR(kaufwertGesamt);
    document.getElementById("hero-veraenderung-pct").textContent = fmtPct(veraenderungPct);
    document.getElementById("hero-veraenderung-abs").textContent = fmtSignedEUR(veraenderungAbs);

    const container = document.getElementById("positions");
    container.innerHTML = "";

    for (const p of positionen) {
      const klasse = TYP_KLASSE[p.typ] || "aktie";
      const anteilAmDepot = depotwert ? (p.wert / depotwert) * 100 : 0;
      const hatVeraenderung = p.diffPct != null;
      const negativ = hatVeraenderung && p.diffPct < 0;

      const card = document.createElement("div");
      card.className = "card" + (hatVeraenderung ? "" : " dimmed");

      let barHtml = "";
      if (hatVeraenderung) {
        const anteil = balkenAnteil(p.diffPct);
        const dicke = balkenDicke(anteil);
        barHtml = `
          <div class="bar-track${negativ ? " neg" : ""}">
            <div class="bar${negativ ? " neg" : ""}" style="height:${dicke.toFixed(1)}px; width:${(anteil * 100).toFixed(1)}%; border-radius:${(dicke / 2).toFixed(1)}px;"></div>
          </div>`;
      }

      const pctHtml = hatVeraenderung
        ? `<span class="pct${negativ ? " neg" : ""}">${fmtPct(p.diffPct)}</span>`
        : `<span class="pct zero">wertlos</span>`;

      card.innerHTML = `
        <div class="card-strip strip-${klasse}"></div>
        <div class="card-body">
          <div class="card-top">
            <span class="badge badge-${klasse}">${p.typ}</span>
            <div class="card-top-right">
              <a class="wkn" href="https://www.finanzen.net/suchergebnis.asp?_search=${p.wkn}" target="_blank" rel="noopener">${p.wkn}</a>
              <div class="card-add-wrap">
                <button type="button" class="add-btn" data-wkn="${p.wkn}" data-name="${p.name}" aria-label="Erfassen für ${p.wkn}">
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                </button>
                <div class="add-menu">
                  <button type="button" data-action="kauf" data-wkn="${p.wkn}" data-name="${p.name}">Kauf erfassen</button>
                  <button type="button" data-action="kursupdate" data-wkn="${p.wkn}" data-name="${p.name}">Kursupdate erfassen</button>
                </div>
              </div>
            </div>
          </div>
          <div class="card-name">${p.name}</div>
          <div class="card-value-row">
            <span class="card-value">${fmtEUR(p.wert)}</span>
            ${p.kurs != null ? `<span class="card-value-detail">(${fmtKurs(p.kurs)})${p.kursDatum ? " " + fmtDatum(p.kursDatum) : ""}</span>` : ""}
          </div>
          <div class="card-sub-row">${p.kaufwert != null ? `Kaufwert ${fmtEUR(p.kaufwert)} (${fmtKurs(p.kaufkurs)}) · ` : ""}${fmtStueck(p.stueck)} Stück</div>
          ${barHtml}
          <div class="card-foot">
            ${pctHtml}
            <span class="share"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>${anteilAmDepot.toLocaleString("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 1 })}%</span>
          </div>
        </div>`;
      container.appendChild(card);
    }
  }

  render();

  // --- Erfassung neuer Events -------------------------------------------------
  const HEUTE = "2026-07-26";

  function naechsteSeq() {
    return Math.max(...events.map((e) => e.seq)) + 1;
  }
  function jetzt() {
    return new Date().toISOString();
  }

  // Globale Erfassung: neue Position = ein "kauf"- und ein "kursupdate"-Event zusammen,
  // sonst wäre die Position sofort "wertlos".
  const dialogNeuePosition = document.getElementById("dialog-neue-position");
  document.getElementById("btn-neue-position").addEventListener("click", () => {
    const form = document.getElementById("form-neue-position");
    form.reset();
    form.datum.value = HEUTE;
    dialogNeuePosition.showModal();
  });
  // Aktueller Kurs ist beim Neuanlegen meist noch der Kaufkurs -> als Vorschlag übernehmen,
  // sobald das Kaufkurs-Feld verlassen wird, aber nur falls der Nutzer dort noch nichts
  // eingetragen hat.
  document.getElementById("np-kaufkurs").addEventListener("blur", (e) => {
    const kursFeld = document.getElementById("np-kurs");
    if (e.target.value !== "" && kursFeld.value === "") kursFeld.value = e.target.value;
  });
  document.getElementById("form-neue-position").addEventListener("submit", (e) => {
    e.preventDefault();
    const form = e.target;
    const timestamp = jetzt();
    const wkn = form.wkn.value.trim();
    const datum = form.datum.value;
    events.push({ seq: naechsteSeq(), eventType: "kauf", timestamp, payload: {
      wkn, name: form.name.value.trim(), typ: form.typ.value,
      stueck: parseFloat(form.stueck.value), kaufkurs: parseFloat(form.kaufkurs.value), datum,
    }});
    events.push({ seq: naechsteSeq(), eventType: "kursupdate", timestamp, payload: {
      wkn, kurs: parseFloat(form.kurs.value), datum,
    }});
    dialogNeuePosition.close();
    render();
  });

  // Lokale Erfassung: Nachkauf oder Kursupdate zu einer bestehenden Position.
  let aktiveWkn = null;
  const dialogKauf = document.getElementById("dialog-kauf");
  const dialogKursupdate = document.getElementById("dialog-kursupdate");

  function oeffneKaufDialog(wkn, name) {
    aktiveWkn = wkn;
    const form = document.getElementById("form-kauf");
    form.reset();
    form.datum.value = HEUTE;
    document.getElementById("kauf-position-info").textContent = `${name} (${wkn})`;
    dialogKauf.showModal();
  }
  function oeffneKursupdateDialog(wkn, name) {
    aktiveWkn = wkn;
    const form = document.getElementById("form-kursupdate");
    form.reset();
    form.datum.value = HEUTE;
    document.getElementById("kursupdate-position-info").textContent = `${name} (${wkn})`;
    dialogKursupdate.showModal();
  }

  document.getElementById("form-kauf").addEventListener("submit", (e) => {
    e.preventDefault();
    const form = e.target;
    events.push({ seq: naechsteSeq(), eventType: "kauf", timestamp: jetzt(), payload: {
      wkn: aktiveWkn, stueck: parseFloat(form.stueck.value), kaufkurs: parseFloat(form.kaufkurs.value), datum: form.datum.value,
    }});
    dialogKauf.close();
    render();
  });
  document.getElementById("form-kursupdate").addEventListener("submit", (e) => {
    e.preventDefault();
    const form = e.target;
    events.push({ seq: naechsteSeq(), eventType: "kursupdate", timestamp: jetzt(), payload: {
      wkn: aktiveWkn, kurs: parseFloat(form.kurs.value), datum: form.datum.value,
    }});
    dialogKursupdate.close();
    render();
  });

  document.querySelectorAll("[data-close]").forEach((btn) => {
    btn.addEventListener("click", () => btn.closest("dialog").close());
  });

  // Menü am lokalen "+" per Delegation, da Karten bei jedem render() neu aufgebaut werden.
  document.getElementById("positions").addEventListener("click", (e) => {
    const addBtn = e.target.closest(".add-btn");
    if (addBtn) {
      e.stopPropagation();
      const wrap = addBtn.closest(".card-add-wrap");
      const warOffen = wrap.classList.contains("open");
      document.querySelectorAll(".card-add-wrap.open").forEach((w) => w.classList.remove("open"));
      if (!warOffen) wrap.classList.add("open");
      return;
    }
    const menuItem = e.target.closest(".add-menu button");
    if (menuItem) {
      document.querySelectorAll(".card-add-wrap.open").forEach((w) => w.classList.remove("open"));
      const { wkn, name, action } = menuItem.dataset;
      if (action === "kauf") oeffneKaufDialog(wkn, name);
      else oeffneKursupdateDialog(wkn, name);
    }
  });
  document.addEventListener("click", () => {
    document.querySelectorAll(".card-add-wrap.open").forEach((w) => w.classList.remove("open"));
  });
</script>
</body>
</html>
