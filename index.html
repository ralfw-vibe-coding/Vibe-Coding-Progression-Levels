<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mein Depot</title>
<style>
  :root {
    --ink: #181A2A;
    --ink-muted: #6B6D80;
    --ink-faint: #8B8DA0;
    --border: #E7E7EF;
    --track: #F3F3F8;
    --green: #0F9D58;
    --red: #DC2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 20px;
    background: #F4F4F7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    background: #FFFFFF;
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 1px 3px rgba(24,26,42,0.06);
  }
  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }
  .page-header h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
  }
  .page-header .meta {
    font-size: 13px;
    color: var(--ink-faint);
  }
  .hero {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .hero-card {
    border-radius: 12px;
    padding: 16px;
  }
  .hero-card.wert { background: #EEF0FF; }
  .hero-card.veraend { background: #E7F8EF; }
  .hero-label {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    font-size: 12px;
    font-weight: 500;
  }
  .hero-card.wert .hero-label { color: #4F46E5; }
  .hero-card.veraend .hero-label { color: var(--green); }
  .hero-value {
    font-size: 24px;
    font-weight: 600;
    line-height: 1.15;
  }
  .hero-card.veraend .hero-value { color: var(--green); }
  .hero-sub {
    font-size: 12px;
    font-weight: 500;
    margin-top: 4px;
    opacity: 0.75;
  }
  .hero-card.wert .hero-sub { color: #6266C4; }
  .hero-card.veraend .hero-sub { color: var(--green); }
  .positions {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
  }
  .card {
    border: 0.5px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .card.dimmed { opacity: 0.5; }
  .card-strip { height: 4px; }
  .strip-zert { background: #D97706; }
  .strip-fonds { background: #7C3AED; }
  .strip-etf { background: #2563EB; }
  .strip-aktie { background: #DB2777; }
  .card-body { padding: 12px; }
  .card-top {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 500;
  }
  .badge-zert { background: #FDF1DC; color: #8A5A0A; }
  .badge-fonds { background: #F1E9FD; color: #6226C4; }
  .badge-etf { background: #E5EEFF; color: #1D4FBE; }
  .badge-aktie { background: #FCE7F3; color: #A61E5E; }
  .wkn {
    font-size: 11px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--ink-faint);
    text-decoration: none;
  }
  .wkn:hover { text-decoration: underline; }
  .card-name {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 8px;
    cursor: pointer;
  }
  .card-name:hover { color: #4F46E5; }
  .verlauf-chevron {
    flex-shrink: 0;
    color: var(--ink-faint);
    transition: transform 0.15s ease;
  }
  .card.aufgeklappt .verlauf-chevron { transform: rotate(180deg); }
  .verlauf {
    display: none;
    margin-bottom: 8px;
    padding-top: 6px;
    border-top: 0.5px solid var(--border);
  }
  .card.aufgeklappt .verlauf { display: block; }
  .verlauf-eintrag {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-size: 11px;
    color: var(--ink-faint);
    padding: 2px 0;
  }
  .verlauf-eintrag .verlauf-art { color: var(--ink-muted); }
  .card-value-row {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 4px;
  }
  .card-value {
    font-size: 18px;
    font-weight: 600;
  }
  .card-value-detail {
    font-size: 12px;
    font-weight: 400;
    color: var(--ink-faint);
  }
  .card-sub-row {
    font-size: 12px;
    color: var(--ink-faint);
    margin-bottom: 8px;
  }
  .bar-track {
    height: 9px;
    display: flex;
    align-items: center;
    margin-bottom: 8px;
  }
  .bar-track.neg { justify-content: flex-end; }
  .bar {
    background: var(--green);
  }
  .bar.neg { background: var(--red); }
  .card-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .pct { font-size: 12px; font-weight: 500; color: var(--green); }
  .pct.neg { color: var(--red); }
  .pct.zero { color: var(--ink-faint); }
  .share {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--ink-faint);
  }
  .share svg { flex-shrink: 0; }

  .filter-bar {
    margin-bottom: 16px;
  }
  .filter-typen {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }
  .filter-suche {
    width: 100%;
    padding: 8px 10px;
    border: 0.5px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    color: var(--ink);
  }
  .typ-chip {
    padding: 4px 10px;
    border-radius: 999px;
    border: 0.5px solid var(--border);
    background: #FFFFFF;
    color: var(--ink-muted);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }
  .typ-chip:hover { background: var(--track); }
  .typ-chip.active.chip-aktie { background: #FCE7F3; color: #A61E5E; border-color: transparent; }
  .typ-chip.active.chip-etf { background: #E5EEFF; color: #1D4FBE; border-color: transparent; }
  .typ-chip.active.chip-zert { background: #FDF1DC; color: #8A5A0A; border-color: transparent; }
  .typ-chip.active.chip-fonds { background: #F1E9FD; color: #6226C4; border-color: transparent; }

  .page-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .page-header-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .add-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    padding: 0;
    border: 0.5px solid var(--border);
    border-radius: 999px;
    background: #FFFFFF;
    color: var(--ink-muted);
    cursor: pointer;
  }
  .add-btn:hover { background: var(--track); color: var(--ink); }
  .card-top-right {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card-add-wrap {
    position: relative;
  }
  .card-add-wrap .add-btn { width: 18px; height: 18px; }
  .add-menu {
    display: none;
    position: absolute;
    right: 0;
    top: 24px;
    z-index: 10;
    background: #FFFFFF;
    border: 0.5px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(24,26,42,0.12);
    min-width: 160px;
    overflow: hidden;
  }
  .card-add-wrap.open .add-menu { display: block; }
  .add-menu button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 8px 12px;
    border: none;
    background: none;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
    font-family: inherit;
  }
  .add-menu button:hover { background: var(--track); }

  dialog {
    border: none;
    border-radius: 16px;
    padding: 24px;
    width: 320px;
    max-width: calc(100vw - 40px);
    box-shadow: 0 8px 32px rgba(24,26,42,0.18);
  }
  dialog::backdrop { background: rgba(24,26,42,0.35); }
  dialog h2 {
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 16px;
  }
  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--ink-muted);
    margin-bottom: 4px;
  }
  .field input, .field select {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    border: 0.5px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    color: var(--ink);
  }
  .field-info {
    font-size: 13px;
    color: var(--ink-muted);
    margin-bottom: 12px;
  }
  .dialog-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 20px;
  }
  .btn {
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-secondary {
    border: 0.5px solid var(--border);
    background: #FFFFFF;
    color: var(--ink);
  }
  .btn-secondary:hover { background: var(--track); }
  .btn-primary {
    border: none;
    background: var(--ink);
    color: #FFFFFF;
  }
  .btn-primary:hover { opacity: 0.9; }
</style>
</head>
<body>
<main>

  <div class="page-header">
    <div class="page-header-left">
      <h1>Mein Depot</h1>
      <button type="button" class="add-btn" id="btn-neue-position" aria-label="Neue Position erfassen">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      </button>
    </div>
    <div class="page-header-right">
      <button type="button" class="add-btn" id="btn-import" aria-label="Ereignisse aus Datei laden" title="Aus Datei laden">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
      </button>
      <button type="button" class="add-btn" id="btn-export" aria-label="Ereignisse in Datei speichern" title="In Datei speichern">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
      </button>
      <div class="meta" id="heute-anzeige"></div>
    </div>
  </div>

  <div class="hero">
    <div class="hero-card wert">
      <div class="hero-label">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
        <span>Depotwert</span>
      </div>
      <div class="hero-value" id="hero-wert"></div>
      <div class="hero-sub" id="hero-kaufwert"></div>
    </div>
    <div class="hero-card veraend">
      <div class="hero-label">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
        <span>Veränderung</span>
      </div>
      <div class="hero-value" id="hero-veraenderung-pct"></div>
      <div class="hero-sub" id="hero-veraenderung-abs"></div>
    </div>
  </div>

  <div class="filter-bar">
    <input type="text" class="filter-suche" id="filter-suche" placeholder="Suche nach Name…">
    <div class="filter-typen">
      <button type="button" class="typ-chip chip-aktie" data-typ="Aktie">Aktie</button>
      <button type="button" class="typ-chip chip-etf" data-typ="ETF">ETF</button>
      <button type="button" class="typ-chip chip-zert" data-typ="Zertifikat">Zertifikat</button>
      <button type="button" class="typ-chip chip-fonds" data-typ="Fonds">Fonds</button>
    </div>
  </div>

  <div class="positions" id="positions"></div>

</main>

<dialog id="dialog-neue-position">
  <form id="form-neue-position">
    <h2>Neue Position erfassen</h2>
    <div class="field"><label for="np-wkn">WKN</label><input id="np-wkn" name="wkn" type="text" required></div>
    <div class="field"><label for="np-name">Name</label><input id="np-name" name="name" type="text" required></div>
    <div class="field">
      <label for="np-typ">Typ</label>
      <select id="np-typ" name="typ">
        <option>Aktie</option>
        <option>ETF</option>
        <option>Zertifikat</option>
        <option>Fonds</option>
      </select>
    </div>
    <div class="field"><label for="np-stueck">Stück</label><input id="np-stueck" name="stueck" type="number" step="any" min="0" required></div>
    <div class="field"><label for="np-kaufkurs">Kaufkurs (€)</label><input id="np-kaufkurs" name="kaufkurs" type="number" step="any" min="0" required></div>
    <div class="field"><label for="np-kurs">Aktueller Kurs (€)</label><input id="np-kurs" name="kurs" type="number" step="any" min="0" required></div>
    <div class="field"><label for="np-datum">Datum</label><input id="np-datum" name="datum" type="date" required></div>
    <div class="dialog-actions">
      <button type="button" class="btn btn-secondary" data-close>Abbrechen</button>
      <button type="submit" class="btn btn-primary">Speichern</button>
    </div>
  </form>
</dialog>

<dialog id="dialog-kauf">
  <form id="form-kauf">
    <h2>Kauf erfassen</h2>
    <div class="field-info" id="kauf-position-info"></div>
    <div class="field"><label for="k-stueck">Stück</label><input id="k-stueck" name="stueck" type="number" step="any" min="0" required></div>
    <div class="field"><label for="k-kaufkurs">Kaufkurs (€)</label><input id="k-kaufkurs" name="kaufkurs" type="number" step="any" min="0" required></div>
    <div class="field"><label for="k-datum">Datum</label><input id="k-datum" name="datum" type="date" required></div>
    <div class="dialog-actions">
      <button type="button" class="btn btn-secondary" data-close>Abbrechen</button>
      <button type="submit" class="btn btn-primary">Speichern</button>
    </div>
  </form>
</dialog>

<dialog id="dialog-kursupdate">
  <form id="form-kursupdate">
    <h2>Kursupdate erfassen</h2>
    <div class="field-info" id="kursupdate-position-info"></div>
    <div class="field"><label for="ku-kurs">Kurs (€)</label><input id="ku-kurs" name="kurs" type="number" step="any" min="0" required></div>
    <div class="field"><label for="ku-datum">Datum</label><input id="ku-datum" name="datum" type="date" required></div>
    <div class="dialog-actions">
      <button type="button" class="btn btn-secondary" data-close>Abbrechen</button>
      <button type="submit" class="btn btn-primary">Speichern</button>
    </div>
  </form>
</dialog>

<!-- Module: Klassische Scripts (kein type="module"), damit die Seite per Doppelklick unter
     file:// funktioniert. Dieselben Dateien sind per node:module createRequire() auch aus
     Deno-Tests nutzbar (siehe tests/). Bis auf imExportProvider.js — der kapselt bewusst
     Browser-Technologie — sind alle Module frei von DOM. -->
<script src="eventStore.js"></script>
<script src="domain.js"></script>
<script src="localStorageProvider.js"></script>
<script src="imExportProvider.js"></script>
<script src="body.js"></script>

<script>
  // --- Komposition: der einzige Ort, an dem die Module zusammengesteckt werden ---
  // Kein Startbestand mehr: das Depot beginnt leer, außer der Browser hat schon einmal
  // etwas gespeichert. Was vorher fest eingebacken war, steht jetzt in startbestand.json
  // und lässt sich über den Import laden.
  const speicher = createLocalStorageProvider(localStorage, "depot-events");
  const imExport = createImExportProvider();
  const eventStore = createEventStore();
  const domain = createDomain(eventStore);
  const body = createBody(domain, speicher, imExport);

  body.initialisieren();
</script>

<script>
  // --- Frontend: alles HTML/DOM. Kennt nur `body`, nie die Domäne oder den Event-Store. ---
  const TYP_KLASSE = { "Zertifikat": "zert", "Fonds": "fonds", "ETF": "etf", "Aktie": "aktie" };
  // Echtes "heute" statt eines festen Datums — es gibt keine feste Geschichte mehr, an die
  // ein Datum gebunden wäre, das Depot gehört, wem auch immer gerade den Browser benutzt.
  const jetzt = new Date();
  const HEUTE = `${jetzt.getFullYear()}-${String(jetzt.getMonth() + 1).padStart(2, "0")}-${String(jetzt.getDate()).padStart(2, "0")}`;
  const aufgeklappt = new Set(); // welche Positionen ihren Verlauf zeigen, übersteht render()

  function fmtEUR(n) {
    return n.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
  }
  function fmtSignedEUR(n) {
    return (n >= 0 ? "+" : "") + fmtEUR(n);
  }
  function fmtPct(n) {
    return (n >= 0 ? "+" : "") + n.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "%";
  }
  // Kurse (Einzelpreise) behalten ihre Quellgenauigkeit (z. B. 11,1479 € bei Bruchstück-ETFs)
  // statt auf 2 Nachkommastellen gerundet zu werden wie die großen Summen.
  function fmtKurs(n) {
    return n.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 4 }) + " €";
  }
  function fmtStueck(n) {
    return Number.isInteger(n) ? n.toLocaleString("de-DE") : n.toLocaleString("de-DE", { minimumFractionDigits: 3, maximumFractionDigits: 3 });
  }
  function fmtDatum(datum) {
    const [jahr, monat, tag] = datum.split("T")[0].split("-");
    return `${tag}.${monat}.${jahr}`;
  }
  // Logarithmische Balkenskala: 0 % -> 0 %, 100 % Kursgewinn -> ~50 % Länge,
  // 500 % -> ~75 % Länge. Keine harte Obergrenze, nur zunehmend flacher. Reine
  // Visualisierungslogik ohne Domänenwissen, daher hier im Frontend.
  function balkenAnteil(pct) {
    return Math.min(1, (0.5 * Math.log(1 + Math.abs(pct) / 5)) / Math.log(21));
  }
  function balkenDicke(anteil) {
    return Math.min(9, Math.max(3, 3 + 6 * anteil));
  }

  function verlaufHtml(wertpapierId) {
    const eintraege = body.positionsverlaufAbfragen(wertpapierId);
    const zeilen = eintraege.map((e) => {
      const art = e.eventType === "kauf" ? "Kauf" : "Kurs";
      const detail = e.eventType === "kauf"
        ? `${fmtStueck(e.stueck)} Stück${e.kaufkurs != null ? " @ " + fmtKurs(e.kaufkurs) : ""}`
        : fmtKurs(e.kurs);
      return `<div class="verlauf-eintrag"><span>${fmtDatum(e.datum)} · <span class="verlauf-art">${art}</span></span><span>${detail}</span></div>`;
    }).join("");
    return `<div class="verlauf">${zeilen}</div>`;
  }

  function renderModell(modell) {
    document.getElementById("hero-wert").textContent = fmtEUR(modell.depotwert);
    document.getElementById("hero-kaufwert").textContent = "Kaufwert " + fmtEUR(modell.kaufwertGesamt);
    document.getElementById("hero-veraenderung-pct").textContent = fmtPct(modell.veraenderungPct);
    document.getElementById("hero-veraenderung-abs").textContent = fmtSignedEUR(modell.veraenderungAbs);

    const container = document.getElementById("positions");
    container.innerHTML = "";

    for (const p of modell.positionen) {
      const klasse = TYP_KLASSE[p.typ] || "aktie";
      const hatVeraenderung = p.diffPct != null;
      const negativ = hatVeraenderung && p.diffPct < 0;
      const istAufgeklappt = aufgeklappt.has(p.wertpapierId);

      const card = document.createElement("div");
      card.className = "card" + (hatVeraenderung ? "" : " dimmed") + (istAufgeklappt ? " aufgeklappt" : "");

      let barHtml = "";
      if (hatVeraenderung) {
        const anteil = balkenAnteil(p.diffPct);
        const dicke = balkenDicke(anteil);
        barHtml = `
          <div class="bar-track${negativ ? " neg" : ""}">
            <div class="bar${negativ ? " neg" : ""}" style="height:${dicke.toFixed(1)}px; width:${(anteil * 100).toFixed(1)}%; border-radius:${(dicke / 2).toFixed(1)}px;"></div>
          </div>`;
      }

      const pctHtml = hatVeraenderung
        ? `<span class="pct${negativ ? " neg" : ""}">${fmtPct(p.diffPct)}</span>`
        : `<span class="pct zero">wertlos</span>`;

      card.innerHTML = `
        <div class="card-strip strip-${klasse}"></div>
        <div class="card-body">
          <div class="card-top">
            <span class="badge badge-${klasse}">${p.typ}</span>
            <div class="card-top-right">
              <a class="wkn" href="https://www.finanzen.net/suchergebnis.asp?_search=${p.wertpapierId}" target="_blank" rel="noopener">${p.wertpapierId}</a>
              <div class="card-add-wrap">
                <button type="button" class="add-btn" data-wertpapier-id="${p.wertpapierId}" data-name="${p.name}" aria-label="Erfassen für ${p.wertpapierId}">
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                </button>
                <div class="add-menu">
                  <button type="button" data-action="kauf" data-wertpapier-id="${p.wertpapierId}" data-name="${p.name}">Kauf erfassen</button>
                  <button type="button" data-action="kursupdate" data-wertpapier-id="${p.wertpapierId}" data-name="${p.name}">Kursupdate erfassen</button>
                </div>
              </div>
            </div>
          </div>
          <div class="card-name" data-verlauf-toggle="${p.wertpapierId}">
            <span>${p.name}</span>
            <svg class="verlauf-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </div>
          ${istAufgeklappt ? verlaufHtml(p.wertpapierId) : ""}
          <div class="card-value-row">
            <span class="card-value">${fmtEUR(p.wert)}</span>
            ${p.kurs != null ? `<span class="card-value-detail">(${fmtKurs(p.kurs)})${p.kursDatum ? " " + fmtDatum(p.kursDatum) : ""}</span>` : ""}
          </div>
          <div class="card-sub-row">${p.kaufwert != null ? `Kaufwert ${fmtEUR(p.kaufwert)} (${fmtKurs(p.kaufkurs)}) · ` : ""}${fmtStueck(p.stueck)} Stück</div>
          ${barHtml}
          <div class="card-foot">
            ${pctHtml}
            <span class="share"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>${p.anteilAmDepot.toLocaleString("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 1 })}%</span>
          </div>
        </div>`;
      container.appendChild(card);
    }
  }

  document.getElementById("heute-anzeige").textContent = fmtDatum(HEUTE);

  const aktiverFilter = { suchbegriff: "", typen: [] };
  function neuRendern() {
    renderModell(body.depotAbfragen(aktiverFilter));
  }

  neuRendern();

  // --- Im-/Export: das Frontend stößt nur an, der Body orchestriert Datei, Domäne und
  // Browser-Speicher. Kein Reload nötig — nach dem Import steht das neue Modell sofort da. ---
  document.getElementById("btn-export").addEventListener("click", () => {
    body.exportieren();
  });
  document.getElementById("btn-import").addEventListener("click", async () => {
    try {
      const modell = await body.importieren();
      if (modell) neuRendern(); // null = Dialog abgebrochen
    } catch (fehler) {
      alert("Die Datei konnte nicht gelesen werden: " + fehler.message);
    }
  });

  // --- Filterung: Suchbegriff + Typ-Chips. Reine Anzeigefrage, Depotwert/Veränderung
  // und anteilAmDepot bleiben unverändert (siehe body.js) — nur welche Karten
  // erscheinen, ändert sich. ---
  document.getElementById("filter-suche").addEventListener("input", (e) => {
    aktiverFilter.suchbegriff = e.target.value;
    neuRendern();
  });
  document.querySelectorAll(".typ-chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      const typ = chip.dataset.typ;
      const index = aktiverFilter.typen.indexOf(typ);
      if (index === -1) aktiverFilter.typen.push(typ);
      else aktiverFilter.typen.splice(index, 1);
      chip.classList.toggle("active");
      neuRendern();
    });
  });

  // --- Globale Erfassung: neue Position = Kauf + Kursupdate zusammen (Body-Workflow) ---
  const dialogNeuePosition = document.getElementById("dialog-neue-position");
  document.getElementById("btn-neue-position").addEventListener("click", () => {
    const form = document.getElementById("form-neue-position");
    form.reset();
    form.datum.value = HEUTE;
    dialogNeuePosition.showModal();
  });
  // Aktueller Kurs ist beim Neuanlegen meist noch der Kaufkurs -> als Vorschlag übernehmen,
  // sobald das Kaufkurs-Feld verlassen wird, aber nur falls der Nutzer dort noch nichts
  // eingetragen hat.
  document.getElementById("np-kaufkurs").addEventListener("blur", (e) => {
    const kursFeld = document.getElementById("np-kurs");
    if (e.target.value !== "" && kursFeld.value === "") kursFeld.value = e.target.value;
  });
  document.getElementById("form-neue-position").addEventListener("submit", (e) => {
    e.preventDefault();
    const form = e.target;
    body.neuePositionErfassen({
      wertpapierId: form.wkn.value.trim(),
      name: form.name.value.trim(),
      typ: form.typ.value,
      stueck: parseFloat(form.stueck.value),
      kaufkurs: parseFloat(form.kaufkurs.value),
      kurs: parseFloat(form.kurs.value),
      datum: form.datum.value,
    });
    dialogNeuePosition.close();
    neuRendern();
  });

  // --- Lokale Erfassung: Nachkauf oder Kursupdate zu einer bestehenden Position ---
  let aktiveWertpapierId = null;
  const dialogKauf = document.getElementById("dialog-kauf");
  const dialogKursupdate = document.getElementById("dialog-kursupdate");

  function oeffneKaufDialog(wertpapierId, name) {
    aktiveWertpapierId = wertpapierId;
    const form = document.getElementById("form-kauf");
    form.reset();
    form.datum.value = HEUTE;
    document.getElementById("kauf-position-info").textContent = `${name} (${wertpapierId})`;
    dialogKauf.showModal();
  }
  function oeffneKursupdateDialog(wertpapierId, name) {
    aktiveWertpapierId = wertpapierId;
    const form = document.getElementById("form-kursupdate");
    form.reset();
    form.datum.value = HEUTE;
    document.getElementById("kursupdate-position-info").textContent = `${name} (${wertpapierId})`;
    dialogKursupdate.showModal();
  }

  document.getElementById("form-kauf").addEventListener("submit", (e) => {
    e.preventDefault();
    const form = e.target;
    body.kaufErfassen({
      wertpapierId: aktiveWertpapierId,
      stueck: parseFloat(form.stueck.value),
      kaufkurs: parseFloat(form.kaufkurs.value),
      datum: form.datum.value,
    });
    dialogKauf.close();
    neuRendern();
  });
  document.getElementById("form-kursupdate").addEventListener("submit", (e) => {
    e.preventDefault();
    const form = e.target;
    body.kursupdateErfassen({
      wertpapierId: aktiveWertpapierId,
      kurs: parseFloat(form.kurs.value),
      datum: form.datum.value,
    });
    dialogKursupdate.close();
    neuRendern();
  });

  document.querySelectorAll("[data-close]").forEach((btn) => {
    btn.addEventListener("click", () => btn.closest("dialog").close());
  });

  // Menü am lokalen "+" und Verlauf-Umschalter per Delegation, da Karten bei jedem
  // renderModell() neu aufgebaut werden.
  document.getElementById("positions").addEventListener("click", (e) => {
    const addBtn = e.target.closest(".add-btn");
    if (addBtn) {
      e.stopPropagation();
      const wrap = addBtn.closest(".card-add-wrap");
      const warOffen = wrap.classList.contains("open");
      document.querySelectorAll(".card-add-wrap.open").forEach((w) => w.classList.remove("open"));
      if (!warOffen) wrap.classList.add("open");
      return;
    }
    const menuItem = e.target.closest(".add-menu button");
    if (menuItem) {
      document.querySelectorAll(".card-add-wrap.open").forEach((w) => w.classList.remove("open"));
      const { wertpapierId, name, action } = menuItem.dataset;
      if (action === "kauf") oeffneKaufDialog(wertpapierId, name);
      else oeffneKursupdateDialog(wertpapierId, name);
      return;
    }
    const verlaufToggle = e.target.closest("[data-verlauf-toggle]");
    if (verlaufToggle) {
      const wertpapierId = verlaufToggle.dataset.verlaufToggle;
      if (aufgeklappt.has(wertpapierId)) aufgeklappt.delete(wertpapierId);
      else aufgeklappt.add(wertpapierId);
      neuRendern();
    }
  });
  document.addEventListener("click", () => {
    document.querySelectorAll(".card-add-wrap.open").forEach((w) => w.classList.remove("open"));
  });
</script>
</body>
</html>
